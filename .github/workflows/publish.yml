name: Publish to PowerShell Gallery

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install PSResourceGet
        shell: pwsh
        run: |
          Install-Module -Name Microsoft.PowerShell.PSResourceGet -Force -Scope CurrentUser

      - name: Extract release notes
        id: release_notes
        shell: pwsh
        run: |
          $event = Get-Content $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $notes = $event.release.body
          if ([string]::IsNullOrWhiteSpace($notes)) { $notes = "Release published via GitHub Actions." }
          
          # Modern GITHUB_OUTPUT format for multi-line release notes
          "notes<<EOF`n$($notes.Replace("`r`n","`n"))`nEOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Validate module and environment
        id: validate_module
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PUSH_TO_PSGALLERY }}
        run: |
          # 1. Fail early if GitHub secret is missing/empty
          if ([string]::IsNullOrWhiteSpace($env:PSGALLERY_API_KEY)) {
            Write-Error "PSGALLERY_API_KEY (secrets.PUSH_TO_PSGALLERY) is not set in GitHub settings. Aborting."
            exit 1
          }

          # 2. Auto-detect manifest & guard against multiple manifests
          $manifests = Get-ChildItem -Path ./ -Filter '*.psd1' -Recurse -File -ErrorAction SilentlyContinue
          if (-not $manifests) {
            Write-Error "No .psd1 module manifest found in repository. Aborting."
            exit 1
          }
          if ($manifests.Count -gt 1) {
            Write-Error "Multiple .psd1 manifests found ($($manifests.Count)). Specify the module explicitly. Aborting."
            exit 1
          }

          # 3. Inspect manifest and expose path/version as outputs
          $manifest = $manifests[0]
          $modulePath = $manifest.Directory.FullName
          # Import-PowerShellDataFile is available in PowerShell 7+ and returns a hashtable from the .psd1
          try {
            $psd1 = Import-PowerShellDataFile -Path $manifest.FullName
            $version = $psd1.Version
          } catch {
            Write-Warning "Unable to import .psd1 to read Version. Continuing but cannot validate Version field."
            $version = ''
          }

          if (-not $version) {
            Write-Warning "Manifest Version is empty — ensure you increment Version for each release to avoid Gallery rejections."
          }

          if (-not (Test-Path (Join-Path $modulePath 'README.md'))) {
            Write-Warning "README.md not found in $modulePath — Gallery listing may lack documentation."
          }

          # export outputs for downstream steps (single-line values)
          "module_path=$modulePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "module_version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish module to PSGallery
        shell: pwsh
        env:
          PSGALLERY_API_KEY: ${{ secrets.PUSH_TO_PSGALLERY }}
        run: |
          # Use the exact path detected in the validation step
          $modulePath = "${{ steps.validate_module.outputs.module_path }}"
          $moduleVersion = "${{ steps.validate_module.outputs.module_version }}"
          
          Write-Host "Publishing module from $modulePath (version: $moduleVersion)"
          Publish-PSResource -Path $modulePath -Repository PSGallery -ApiKey $env:PSGALLERY_API_KEY -ReleaseNotes "${{ steps.release_notes.outputs.notes }}" -Verbose